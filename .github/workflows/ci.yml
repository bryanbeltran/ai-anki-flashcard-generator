name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: TMPDIR=/var/tmp npm run check
      - run: npm install --global agent-browser@0.38.2
      - run: agent-browser install
      - run: TMPDIR=/var/tmp npm run e2e
      - run: npm run seed-artifacts
      - run: git diff --exit-code -- examples/decks
